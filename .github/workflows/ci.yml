name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble and sign the app bundle
        run: CLAUDE_USAGE_DEST="$RUNNER_TEMP/Claude Usage.app" Scripts/build-app.sh

      - name: Verify the signature
        run: codesign --verify --strict "$RUNNER_TEMP/Claude Usage.app"
